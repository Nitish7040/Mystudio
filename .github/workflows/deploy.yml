name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - Master  # Make sure this matches your actual default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Correct action to checkout your repo

      - name: Setup Pages
        uses: actions/configure-pages@v4  # Latest version of configure-pages

      - name: Upload website files
        uses: actions/upload-pages-artifact@v2  # Updated to latest stable version
        with:
          path: ./  # Change this to your build output directory if needed

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2  # Ensure latest version is used
