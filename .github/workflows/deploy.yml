name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - Master # Adjust if your default branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload website files
        uses: actions/upload-pages-artifact@v1  # Latest available version
        with:
          path: ./  # Adjust the path to your static files if necessary

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4  # Ensure you're using v4 or newer
