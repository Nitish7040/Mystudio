name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - Master  # Ensure this matches your actual branch name (GitHub is case-sensitive)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Correct action to checkout your repo

      - name: Setup Pages
        uses: actions/configure-pages@v4  # Latest version of configure-pages

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3  # Updated to latest stable version
        with:
          path: ./  # Change this if your site files are in a subfolder like 'dist' or 'public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2  # Latest version for deployment
