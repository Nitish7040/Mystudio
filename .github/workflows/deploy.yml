name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - Master  # Ensure this matches your actual branch name (GitHub is case-sensitive)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Correct action for checking out code

      - name: Setup Pages
        uses: actions/configure-pages@v4  # Corrected action for GitHub Pages setup

      - name: Upload website files
        uses: actions/upload-pages-artifact@v2  # Updated to latest stable version
        with:
          path: ./  # Adjust if necessary

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2  # Ensure latest version is used
